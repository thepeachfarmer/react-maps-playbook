server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A cheap liveness check for Docker / an uptime monitor. It must be an exact
  # match, or the SPA fallback below would answer it with index.html.
  location = /health {
    default_type application/json;
    return 200 '{"status":"ok"}';
  }

  # Vite's content-hashed bundles never change: cache them for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Share data: always revalidate, and keep it out of search engines.
  location /shares/ {
    # A types block here replaces the MIME map for this location only.
    types { application/geo+json geojson; application/json json; }
    default_type application/json;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files $uri =404;
  }

  # Share viewer pages are client-side routes: serve the app shell.
  location /s/ {
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow";
    try_files /index.html =404;
  }

  # Everything else: a real file, or the app shell (SPA fallback). The shell
  # is never cached, so a deploy always wins on the next load.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # In a real app, proxy the API to the backend container by service name:
  # location /api/ { proxy_pass http://api:3000; proxy_set_header Host $host;
  #                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

  gzip on;
  gzip_types text/css application/javascript application/json application/geo+json image/svg+xml;
}
