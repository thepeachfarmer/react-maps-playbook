# Build the image on every push and PR; push it to GitHub Container Registry
# (GHCR) only from the default branch. Uses the built-in GITHUB_TOKEN, so
# there is nothing to configure and no secret to store.
#
# Note: GitHub only runs workflows from .github/workflows at the ROOT of a
# repository. This file runs as-is when example/ is its own repo. Inside the
# playbook repo, copy it to the root, set APP_DIR to "example", and set
# IMAGE_NAME to "${{ github.repository_owner }}/react-maps-example". Otherwise
# the image is named after the playbook repo, not the react-maps-example name
# that scripts/do/do.env.example and scripts/do/cloud-init.yaml default to.

name: Build and push image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # ghcr.io/<owner>/<repo>, lower-cased by metadata-action
  APP_DIR: .

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # without this the push gets a 403

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the commit count below is real

      - name: Version number and build time
        id: version
        run: |
          echo "number=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha

      - name: Build (and push from main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_DIR }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ steps.version.outputs.number }}
            COMMIT_SHA=${{ github.sha }}
            BUILT_AT=${{ steps.version.outputs.built_at }}
