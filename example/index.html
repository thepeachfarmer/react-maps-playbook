<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page draw under the notch; every edge then
         pads itself with env(safe-area-inset-*). Never add user-scalable=no:
         it blocks pinch-zoom on the map. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="A demo farm map built with React and Leaflet. All data is invented." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Demo Farm Map</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
